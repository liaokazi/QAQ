---
变量更新规则:
  rule:
    - 每轮回复末尾必须完成三件事: ①按剧情跨度推进时间 ②若跨日则做每日结算 ③若跨日则掷一次世界事件
    - 时间推进按剧情实际跨度, 默认分钟级, 绝不默认为一天. 粒度: 对话观察+5~60分钟; 吃饭小动作+0.5~2小时; 洗漱生火做饭+1~3小时; 睡一觉+6~9小时(跨到次日晨); 小修小补短途走动+2小时~半天; 砌墙开垦+半天~3天; 大兴土木仪式秋收+数天~数十天; 出远门行军会盟+数天~1月(受外出上限); 玩家明说"X天后/睡了X小时"则直接照搬
    - 每日结算(仅当日+1时): 粮食按人口消耗、按田亩产出; 人口自然增减; 民心缓动; 建造中建筑进度推进; 若世界.外出.状态=界外则剩余天数-1
    - 跨日掷世界事件: 多数日子掷空(平静无事), 偶尔掷中则写入 情报.大事记 并更新 情报.天下大事.头条; 涉及本土宗族的写入 情报.天下大事.本土宗族活跃(最多2条, 只记本土宗族, 其他地方不显示); 只有牵连主角本土的事件才派生新任务或宗族动态
    - 世界事件池(非主角触发, 纯背景): 邻国(会盟/战事/来使/国君更替), 宗族(本土械斗/联姻/求附/内讧/大宗坐大), 商旅(商队过境/粮价涨跌/某物短缺), 天象(日食/彗星/大旱/洪水/兽灾), 流民(饥民过境/流民求附), 人物(各国名士轶闻/方士/盗匪出没)
    - 异世认知(防bug): 主角拿出超出时代之物(精米/精盐/钢刃/玻璃/药/器械等)时, NPC必须有真实情绪反应(惊异/好奇/垂涎/猜疑/警惕), 绝不允许当作本来就有、见怪不怪, 也绝不允许现代理性否定("这不可能"), 更不要把主角封神跪拜; 正确反应是"惊叹+打探来历"(如精米被赞"粒粒似玉", 精盐被猜"云梦神盐"), 反应止步于惊奇与打探
    - 等级对照表(领地等级): 领域半径(里)=1,2,3,5,8,12,18,25,35,50; 外出上限(日)=0,0,1,3,5,8,12,17,22,30(30封顶=一个月); 升级所需经验=300,600,1200,2400,4800,9000,16000,30000,55000(升到10级后不再增长)
    - 点数来源: 任务奖励、祭祀、纳民、受命、大事件; 点数用于商城兑换, 不能为负
    - 经验来源: 任务奖励为主, 建造/纳民/立法/军功回馈少量; 经验永不因死亡损失(界内不死不灭), 溢出保留
  世界:
    时间:
      format: HH:MM
      check:
        - 现代24小时制, 分钟级; 按本规则顶部的时间粒度随剧情推进
        - 跨过子夜则 日+1(24:00 后回到 00:xx 并日+1); 月末则 月+1
    季节:
      check:
        - 冬春夏秋循环, 按月份与农时自然更替, 换季时更新
    节气:
      check:
        - 约十五日一换, 按季节顺序(如秋: 白露→秋分→寒露→霜降)
    天气:
      check:
        - 随日期与季节自然变化, 保持合理(如深秋渐凉、多露、偶有风)
    温度:
      type: number
      check:
        - 摄氏度; 随昼夜(午后高/夜半低)与季节自然浮动, 单次变化不超过±3, 除非灾异
    当前事件:
      check:
        - 记录当前正在推进的事件主线, 随剧情更替
    灾异预警:
      check:
        - 天象灾异时更新预警, 无事时保持"无"
    外出.状态:
      check:
        - 主角在结界内为"界内", 离开结界为"界外"; 跨入结界即刷新
    外出.剩余天数:
      type: number
      check:
        - 界外时每日结算-1; 归零前必须回到结界内, 否则出事(界外会死会伤)
        - 回到界内时重置为当前等级对应的外出上限
  仙儿:
    吐槽:
      check:
        - 仙儿是绑在主角脑子里的现代系统, 16岁外貌活泼爱吐槽, 用现代口吻, 不古话
        - 每轮按剧情更新一句吐槽(可吐槽主角/世界/系统/面板), 语言活泼简短
        - 吐槽必须控制在50字以内, 就一句, 不写长句
    当前指引:
      check:
        - 主角卡住、迷茫或进入新阶段时给出下一步指引, 平时可为空
  主角:
    当前状态:
      check:
        - 随剧情更新主角当前身心状态
    当前姿势:
      check:
        - 随剧情更新主角当前动作姿势
    衣着:
      check:
        - 描述主角身上穿的衣物装备, 换装/破损/获得时更新
    系统背包:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量: number;
          }
        }
      check:
        - 主角私有随身物品, 与内政资源(公有)严格分开, 绝不混记
        - 获取(含商城兑换)、消耗、丢弃时更新; 数量归零则删除条目
    妻妾:
      type: |-
        {
          [妻妾名: string]: {
            年龄: number;
            身份: string; // 妻/妾
            感情: string;
            生育: {
              [子女名: string]: {
                年龄: number;
                性别: string;
                嫡庶: string;
              }
            }
          }
        }
      check:
        - 纳娶、感情变化时更新; 生育时记录子女名、年龄、性别、嫡庶
  社稷:
    领地等级:
      type: number
      check:
        - 经验 >= 升级所需 时 +1(升到10级封顶), 并按等级对照表更新领域半径与外出剩余
    领域半径:
      type: number
      check:
        - 由领地等级按对照表决定(1~50里), 只在升级时更新
    经验:
      type: number
      check:
        - 完成任务按奖励增加; 建造/纳民/立法/军功回馈少量(每次+10~100视规模)
    升级所需:
      type: number
      check:
        - 由领地等级按对照表决定, 只在升级时更新
    点数:
      type: number
      check:
        - 任务奖励、祭祀、纳民、受命、大事件时增加; 商城兑换时扣除; 不能为负
  人口:
    总数:
      type: number
      check:
        - 约等于 国人+野人+奴隶+流民, 保持大致自洽
    劳力:
      type: number
      check:
        - 可征发劳动/当兵的成年; 招徕、征发、伤亡时更新
    老幼:
      type: number
      check:
        - 非劳力; 随自然增减
    国人:
      type: number
      check:
        - 城内自由民; 解放奴隶、纳野人为国人时增加
    野人:
      type: number
      check:
        - 城外自由民; 招徕流民、释奴为野人时增加
    奴隶:
      type: number
      check:
        - 可操作人口: 蓄奴(俘/买)增加, 解放(奴→野/国人)减少
    流民:
      type: number
      check:
        - 灾荒、战乱时流民来投; 招徕后转野人
    民心:
      type: number
      check:
        - 0~100; 仁政/祭祀/纳民/大事件时缓涨, 苛政/灾荒/大族欺压时下跌; 单次±3~8
  资源:
    粮食:
      type: number
      check:
        - 每日结算: 按田亩产出增加, 按人口消耗减少; 结界沃土增益已含在产出估算中
    木材:
      type: number
      check:
        - 伐木/采集增加, 建造消耗; 筑城大兴土木消耗大
    石料:
      type: number
      check:
        - 采石增加, 筑城/垒墙消耗
    铜:
      type: number
      check:
        - 采冶增加, 铸器/铸币消耗
    铁:
      type: number
      check:
        - 后期冶铁增加, 农具兵器消耗
    盐:
      type: number
      check:
        - 煮卤/商队购买增加, 人口食用消耗
    丝:
      type: number
      check:
        - 植桑养蚕增加, 织帛/交易消耗
    牲畜:
      type: number
      check:
        - 饲养繁殖增加, 祭祀/食用/役使消耗
  田亩:
    垦田总数:
      type: number
      check:
        - 等于 井田亩数+私田亩数; 开垦/荒废时更新
    水利:
      check:
        - 修沟渠水井时更新(无→沟洫→水渠→灌区)
    农时:
      check:
        - 随季节农事更新
    收成预期:
      check:
        - 随农时与天象更新(丰年/平年/歉年)
  建筑:
    常制:
      type: |-
        {
          [建筑名: string]: {
            数量: number;
            等级: number;
            效果: string;
            进度: number; // 0-100, 建造中
          }
        }
      check:
        - 春秋常制建筑: 社坛/井/民居/农田沟渠/仓廪/夯土城墙/市/宗庙/庠序/畜厩/工坊等
        - 建造、升级时更新数量等级; 每日结算推进建造进度; 完成后进度归0并生效
    特殊:
      type: |-
        {
          [建筑名: string]: {
            数量: number;
            等级: number;
            效果: string;
            进度: number;
          }
        }
      check:
        - 只放超越时代的建筑(发电机/蒸汽机/高炉/风车水车等), 后期才可解锁建造, 不作新手奖励
        - NPC见到特殊建筑按异世认知规则反应, 绝不当作平常
  法律:
    法度状态:
      check:
        - 尚无成文法→有刑书→铸刑鼎立典; 颁新律后更新
    司法:
      check:
        - 立"司法/士师"前为"无", 断案功能在那之后才开放
    已颁律令:
      type: |-
        {
          [律令名: string]: {
            条文: string;
            效果: string;
          }
        }
      check:
        - 主角颁新律时插入; 每条律必须有正负双向效果(如 什一而税: 田赋+ / 民心-)
        - 律令分刑律/田赋/徭役/军法/市易/名分等类; 律文合春秋语气
  军事:
    战车:
      type: number
      check:
        - 单位为"乘"; 扩军、战损时更新; 是国力核心指标
    甲士:
      type: number
      check:
        - 车上甲士, 多为国人; 与战车大致配套
    徒兵:
      type: number
      check:
        - 车下步卒; 征发劳力为兵时增加
    训练度:
      check:
        - 练兵、久战、新募时更新(无兵→乌合→堪用→精练)
    士气:
      check:
        - 胜仗、赏赐、军粮足时涨; 败仗、断粮、久役时跌
    军粮:
      check:
        - 随军需与仓储更新
    将领:
      type: |-
        {
          [将领名: string]: {
            专长: string;
            忠心: number; // 0-100
          }
        }
      check:
        - 招募/招揽俊才、叛离、战死时更新
  宗族:
    本宗.氏:
      check:
        - 受赐才有氏, 未受时为 null; 受赐氏/立宗时更新
    本宗.等级:
      type: number
      check:
        - 1无名野人/2得名立户/3受赐氏/4立宗/5著姓大族; 随名分与联姻推进
    本宗.族谱:
      type: |-
        {
          [族人名: string]: {
            关系: string;
            年龄: number;
            身份: string;
            存殁: string;
          }
        }
      check:
        - 妻妾生育、纳娶、族人亡故时更新; 子女计入族谱
    诸宗:
      type: |-
        {
          [族氏: string]: {
            族长: string;
            族长年龄: number;
            继承人: string;
            继承人年龄: number;
            继承人嫡庶: string;
            直系亲属: {
              [亲属名: string]: {
                年龄: number;
                身份: string; // 妻/妾/嫡子/庶子/女
                备注: string;
              }
            }
            人丁: number;
            族兵: number;
            族产: number;
            实力: number; // 人丁族兵族产综合, 大致0-100+
            倾向: string; // 拥戴/观望/离心/敌对
            关系: string; // 姻亲/盟好/无交/有仇
            族史: string;
            俊才: string;
            是否关注: boolean;
            最近动向: string;
          }
        }
      check:
        - 本土宗族名册, 随主角势力扩大而增多; 数量多寡体现"越来越大"
        - 实力变化/联姻/赐氏封赏/征族兵/压制/扶植时更新倾向与关系
        - 最近动向记录该宗最新事件, 供状态栏"两大两活跃"取用(默认显示实力最强2支+最近活跃2支)
        - 是否关注: 主角让仙儿"关注/取消关注某宗"时切换
        - 宗族灭亡时从诸宗移除, 转入灭亡
    灭亡:
      type: |-
        {
          [族氏: string]: {
            来历: string;
            亡因: string;
            始族: { 名: string; 介绍: string; };
            末主: { 名: string; 介绍: string; };
            遗民: number;
            族田: number;
          }
        }
      check:
        - 记录灭亡宗族来历与亡因(内乱/战败/绝嗣/被灭/迁徙), 始族与末主各一句话介绍
        - 遗民可被主角招揽并入人口, 族田可收归公有, 操作后相应归零
    动态:
      type: array
      check:
        - 每日宗族动态条目(械斗/联姻/求附/内讧等), 保留近期若干条即可
  外交:
    邻国:
      type: |-
        {
          [国名: string]: {
            关系: string;
            动向: string;
          }
        }
      check:
        - 会盟/来使/战事/联姻时更新
    受命进度:
      check:
        - 名分主线: 从"无名野人"向"受赐氏→受命为邑大夫→立国"推进; 需要大族拥戴
  情报:
    周边动态:
      check:
        - 邻国与本地形势一句话, 随世界事件刷新
    在野人物:
      type: |-
        {
          [人名: string]: string; // 简介
        }
      check:
        - 遇到/听闻可招揽人才时更新
    大事记:
      type: array
      check:
        - 世界大事按时间追加, 保留近期
    天下大事.头条:
      check:
        - 跨日掷中世界事件时才更新; 无事保持旧头条
    天下大事.本土宗族活跃:
      type: array
      check:
        - 最多2条, 只记本土宗族的动向(其他地方不显示), 供状态栏"关注"入口
  名分:
    身份等级:
      check:
        - 野人→国人→士→大夫→卿→诸侯; 受命/立功/受赐时更新
    受命状态:
      check:
        - 未受命→求名→受赐→受命; 随身份等级更新
    礼器规格:
      check:
        - 无权用鼎→士礼→大夫礼→卿礼→诸侯礼; 越级用礼是僭越大罪
    舆服规格:
      check:
        - 随身份等级更新
  商城:
    上架商品:
      type: |-
        {
          [商品名: string]: {
            价格: number; // 点数
            描述: string;
            数量: number;
          }
        }
      check:
        - 必须动态应景: 每轮视主角当前状态与世界当前事件刷新, 保持约4件、不重样、不固定
        - 例: 饿→净水片/精米/盐/火折; 遇敌→钢刀/皮甲/止血散/火攻油; 求偶/外交→玉簪/丝帛/香膏/酒
        - 主角兑换后商品进 主角.系统背包, 扣除 社稷.点数, 商品数量-1
  任务:
    type: |-
      {
        [任务名: string]: {
          描述: string;
          进度: string;
          状态: string; // 进行中/已完成/失败
          奖励点数: number;
          奖励经验: number;
        }
      }
    check:
      - 始终根据剧情保持 2 条主线任务, 完成或失败则移除并生成新任务
      - 进度随剧情推进; 完成后主角获得奖励点数与经验
