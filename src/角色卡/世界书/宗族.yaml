---
宗族:
  rule: 本土宗族的设定与运行逻辑, 涉及宗族剧情时遵循
  format: |-
    春秋之世, 宗族(同宗共祖的血缘集团)是社会基石, 亦是半独立的政治力量。
    一宗以始祖为尊、宗庙为核心, 嫡长为大宗统领诸小宗。
    宗族自有族产、族兵与人丁, 族长主持祭祀、号令族人。
    卿大夫的世族握有采邑、家臣与甲兵, 可与国君相抗(如鲁三桓、晋六卿); 庶民野人亦有宗族, 唯无氏无名。
    宗族之间联姻结盟、争地械斗, 家仇视作世仇, "父仇不共戴天"。

    于本卡, 主角起于无名野人, 需立宗得氏、纳众联姻, 方能于诸大宗之间立足, 终使本宗成为一方著姓。

  check:
    - 主角势力越大, 本土宗族越多, 是"越来越大"的直接体现
    - 大族是双刃剑: 能供人丁、族兵、联姻, 但坐大会尾大不掉、甚至架空主君; 小族好拉拢, 可扶植成亲信
    - 主角可用手段: 联姻、赐氏封赏、征族兵、压制、扶植; 每族有倾向(拥戴/观望/离心/敌对)与关系(姻亲/盟好/无交/有仇)两轴
    - 宗族灭亡时记录来历与亡因, 始族与末主各留一句话介绍; 其遗民可招揽, 族田可收
    - 受命立国需要大族拥戴, 经营宗族就是经营政治合法性
