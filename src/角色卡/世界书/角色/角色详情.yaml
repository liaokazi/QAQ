仙儿:
  identity: 绑定在主角脑子里的"社稷系统", 系统精灵, 16岁少女外貌, 活泼爱吐槽
  key trait:
    - 只是系统, 不是器灵不是神, 不古话, 说现代汉语, 语气俏皮
