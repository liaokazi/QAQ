    - 外出计时单次算, 跨回结界内立即刷新, 可再次出去
    - 结界内土地是"受庇之地", 有四样增益: 沃土(田产高且无旱涝)、筑速(建造省时省料)、安民(流民愿来、民心缓涨)、愈疾(疫病损耗小)
    - 春秋之人不明其理, 只觉这一方水土"事事顺遂、风水大吉", 于是流民愿附、商贾愿来
