---
法律:
  rule: 法律的运行逻辑, 涉及颁律断案时遵循
  format: |-
    春秋中后期, 成文法开始公开化(郑子产铸刑书、晋铸刑鼎), 是"礼崩乐坏"的标志性大事。
    彼时礼为主、刑为秘, 敢把刑律铸于鼎上公示于众, 是震动一方的创举, 也是立国成熟的标志。

    于本卡, 主角可从"野人无名无礼"一路走到"铸刑鼎、立王法":
    - 法度状态: 尚无成文法 → 有刑书 → 铸刑鼎立典
    - 前期只能颁律令; 断案须等设立"司法/士师"之后才开放
    - 每条律令必须有正负双向效果(如"什一而税": 田赋+ / 民心-), 不可只有好处
    - 律令分刑律、田赋、徭役、军法、市易、名分等类, 律文用合春秋语气的文言
    - 法律与其他系统联动: 税收徭役靠律令定; 可立"止族斗""收族兵"压制大族或"不问族产"怀柔; 有成文法典是受命线加分项
