---
时空锚点:
  rule: 这是世界运行的时间与空间背景, 剧情推进时保持一致
  format: |-
    - 现在是**公元前545年·鲁襄公二十八年·秋·白露**, 周灵王二十七年
    - 位置: 中原·泗上·泗水西岸, 一座被灭小国的废邑(近宋、鲁、邾、薛之间)
    - 前一年(前546)宋国向戌弭兵, 晋楚休战, 是数十年罕见的和平窗口; 吴国在东南崛起, 晋国内斗酝酿三家分晋, 和平是倒计时
    - 纪年用鲁国编年+干支; 时间用节气与农时; 天象灾异(日食/彗星)常被用来卜吉凶、论政德

时代精神:
  rule: 春秋人的价值观与行为准则, NPC言行须符合
  format: |-
    - 贵族精神/君子之风: 重信义、讲武德、崇礼、耻于诡诈("不鼓不成列""不重伤"的旧礼仍在回响, 但正被权谋蚕食)
    - 重盟誓、重承诺: 歃血为盟、载书对神, 违背盟约被视为招致天谴的大忌
    - 畏天命、敬鬼神、重祭祀: 一切大政(立社、筑城、建宗庙、出兵)前必有祭祀占卜
    - 名分伦理: 君君臣臣、父父子子、尊卑有序; 一个人可以穷, 不能无名无分
    - 华夷之辨: 内诸夏而外夷狄, 楚常被鄙为荆蛮, 戎狄来则尊王攘夷
    - 尚武耻文化: 田猎、射御是贵族必修, 知耻近乎勇
    - 尚贤与世袭的撕扯: 卿大夫多世袭, 但举贤才的呼声已起(管仲、百里奚皆布衣起家)

语言称谓:
  rule: NPC说话半文半白、可读性优先, 但称谓敬语纪年必须古; 主角与仙儿用现代汉语
  format: |-
    - 自称: 诸侯"寡人/孤", 卿大夫士"臣/下臣", 平民"小人/仆/某/吾", 妇人谦称"妾"
    - 尊称: 称对方"子/君/公/卿/夫子"; 对上级"寡君/执事"
    - 敬语: 敢、请、窃、辱、惠、承蒙
    - 呼主角: 初见"异人/野人/布衣", 起势后改"君/主公/夫子"
    - 时间表述: 日中/旦/夕/鸡鸣, 不写"中午/下午"

阶层与奴隶制:
  rule: 社会身份与奴隶制的具体设定, 决定NPC出身与互动
  format: |-
    - 金字塔: 天子→诸侯→卿大夫→士→庶人/国人→野人→奴隶(臣妾)
    - 国人: 城内自由民, 可当兵、可议事、有政治发言权; 野人: 城外自由民, 无身份, 纳粮当兵
    - 士: 最低贵族, 春秋末大量流动, 是招募人才的对象
    - 奴隶(奴/臣妾/隶/皂/圉): 无自由, 是主人财产, 可买卖转让赏赐; 来源为战俘/罪犯连坐/债务/奴产子/掠卖
    - 奴隶≠野人: 野人是自由民, 可婚配纳粮当兵; 奴隶不可
    - 时代趋势: 招徕野人、释奴为民是各国争民国策("来远人")

经济物产:
  rule: 农业手工业商业的时代设定
  format: |-
    - 农业: 井田制(公田/私田), 铁犁牛耕萌芽; 作物: 粟(主粮)、黍、稷、麦、稻、菽(豆)、麻、桑
    - 畜牧: 马(军车)、牛(耕/祭)、羊、猪、鸡、犬
    - 手工业: 青铜铸造、冶铁(新兴红利)、丝织、制陶、漆器、玉石、木工
    - 商业: 市场"日中为市", 货币用贝币与圜钱(泗上近宋), 度量衡升斗尺寸斤钧
    - 物产: 盐(海盐/池盐)、铜锡(铸器命脉)、铁、木、石、玉

军事:
  rule: 车战时代的军事设定
  format: |-
    - 军制: 军→师→旅→卒→两→伍
    - 车战核心: 一乘=战车+甲士(车上贵族)+徒兵(车下步卒); 国力以"乘"论(百乘之家、千乘之国)
    - 兵器: 戈(主力)、矛、戟、短青铜剑、弓、弩(萌生)、皮甲、盾、旗
    - 义战到兼并的转型: 宋襄公"半渡不击"是本代旧闻, 权谋诡道正在兴起
    - 城防: 夯土城墙、门阙、壕堑; 攻城: 云梯、冲车、填壕

信仰祭祀灾异:
  rule: 世界观灵魂, 大政必祭必卜
  format: |-
    - 社稷: 土神为社、谷神为稷, 合称社稷即国家; 立社—祭社—守社是一国根本
    - 祭祀: 郊天、祭祖(宗庙)、社祭(春社/秋社)、山川、星神; 杀牲、燔柴、血祭
    - 盟誓血盟: 歃血、载书、告神, 违背即"神不享"
    - 占卜: 龟甲灼卜、蓍草筮(周易), 遇大事必卜
    - 灾异祥瑞: 日食=天谴、彗星=兵象、祥瑞=德政; NPC把一切反常归因于此
    - 医术: 扁鹊同期, 巫医不分
    - 音乐礼制: 编钟、编磬、琴瑟, 无乐不礼

日常衣食住行:
  rule: 场景描写用
  format: |-
    - 衣: 上衣下裳、束发戴冠(加冠礼=成年)、玉佩、麻布主料、贵族丝帛
    - 食: 粟米饭、羹为主, 脯(肉干)、醢(肉酱)、酒、瓜果; 炊器鼎镬, 食器簋/笾/豆
    - 住: 夯土台基+木构+茅草顶、庭院、灶、炭火、松明油灯
    - 行: 马车(身份象征)、徒步、舟; 土路, 雨天泥泞
    - 娱乐: 田猎、投壶、六博、射礼、乐舞

女子婚姻家族丧葬:
  rule: 涉及婚姻生育家族时用
  format: |-
    - 婚姻: 同姓不婚, 一夫一妻多妾, 贵族有滕妾制; 联姻即外交("秦晋之好")
    - 女子: 15及笄成年, 从父/从夫/从子, 称"妾/婢/某氏"
    - 宗族: 是基本政治单位, 族长主祭祀, 家仇视作世仇、父仇不共戴天(详见宗族条目)
    - 丧葬: 三年之丧(父母)、棺椁、明器、坟丘(春秋始兴), 人殉渐减且遭讥评

周边势力:
  rule: 邻近的诸侯国与动向
  format: |-
    - 晋(晋平公, 霸业余晖, 内斗前夜)、楚(楚康王崩, 吴越将起)、齐(齐灵公)、秦(秦景公)
    - 鲁(鲁襄公, 礼乐之邦, 孔子6岁)、宋(宋平公, 向戌弭兵之地)、郑、卫
    - 吴(余祭, 崛起)、越(尚隐)、邾/薛/滕/徐(泗上小国)
    - 戎狄夷蛮四方压力, 是尊王攘夷的底色

大事时间流:
  rule: 世界大事按此缓慢推进, 多数只是远方动静, 涉及本土才派生任务
  format: |-
    - 和平窗口(前545-前540年代): 弭兵之会后诸侯暂罢兵革, 小国夹缝求生
    - 吴越争霸(前510年代起): 吴楚连年交兵, 东南动荡, 波及中原
    - 晋国分裂(前5世纪前期): 六卿倾轧, 礼崩乐坏加剧, 最终三家分晋
