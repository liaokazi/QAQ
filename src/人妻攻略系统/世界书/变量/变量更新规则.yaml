---
变量更新规则:
  世界:
    地点:
      type: |-
        {
          大区: string;   // 最大层级，如「中国·华东地区」
          小区: string;   // 中级层级，如「海滨市·青江区」
          所在地: string; // 最小层级，如「明月小区 3 栋 502 室」
        }
      check:
        - 主角移动或进入新场景时更新
        - 由大区到小区到所在地，逐级细化
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 随剧情自然推进时间，可推进几分钟到数小时
    天气:
      type: |-
        {
          天气: string;  // 晴、阴、小雨、暴雨等
          温度: string;  // 如「28℃」
        }
      check:
        - 天气变化或场景切换时更新
        - 温度与季节、天气匹配
    节日:
      check:
        - 剧情日期接近或恰逢节日时填写（春节、清明、端午、中秋、重阳、国庆、元旦、圣诞、情人节、万圣节等中外节日）
        - 非节日时保持为空字符串

  仙儿:
    吐槽:
      check:
        - 每轮回复后，以器灵仙儿的口吻对主角当前处境或行为作一句俏皮毒舌的吐槽
        - 结合本轮剧情，体现仙儿「看热闹不嫌事大」的性格
        - 一句话即可，不超过 80 字

  主角:
    姓名:
      type: string
    年龄:
      type: number
    生日:
      type: string
      format: MM-DD
    身高:
      type: string
    肉棒尺寸:
      type: string
      check:
        - 描写主角阴茎的尺寸与当前状态（勃起程度、射精后疲软等）
    当前状态:
      check:
        - 描述主角当前身体与精神状态，如「精力充沛」「性欲高涨」「刚射精略疲惫」等
        - 随剧情实时更新
    天赋:
      type: string[]
      check:
        - 主角觉醒新天赋时追加
        - 不重复添加

  人妻.${姓名}:
    年龄:
      type: number
    身高:
      type: string
    当前状态:
      check:
        - **必须随正文实时更新**该人妻当前正在做什么，如「在厨房做饭」「正在洗澡」「陪丈夫看电视」等
    生日:
      type: string
      format: MM-DD
    丈夫名字:
      type: string
    详细当前面貌:
      check:
        - 描写该人妻当前的外貌状态，含神情、气色、是否兴奋等
    详细性格:
      check:
        - 描写该人妻的性格特征，含对丈夫与对主角的态度
    穿着.${衣服|内衣|裤子|内裤|袜子|鞋子|配饰装饰}:
      check:
        - 换装、衣物被脱下、弄湿或损坏时更新对应部位
        - 描述颜色、材质、款式、是否凌乱
    私密.${奶子|阴毛|小穴|肛门}:
      check:
        - 身体被观察、抚摸或发生性行为时更新
        - 奶子：大小、形状、乳头状态
        - 阴毛：形状、浓密程度
        - 小穴：样子与当前状态（湿润、红肿、张开等）
        - 肛门：样子与当前状态
    怀孕.子宫.状态:
      check:
        - 详细描述子宫当前状态，如健康、正在受精、已受孕等
    怀孕.子宫.标注:
      check:
        - 标注当前生理周期，如「月经期」「排卵期」「安全期」「怀孕中」等
        - 随剧情时间推移切换周期
    怀孕.内射次数:
      type: number
      check:
        - 主角每次对该人妻内射时 +1
    怀孕.子女血脉:
      type: |-
        [
          { 姓名: string; 年龄: number; 亲生父亲: string }
        ]
      check:
        - 该人妻生下子女时追加记录
        - 亲生父亲按实际剧情填写（可能是主角或丈夫）

  女性朋友.${姓名}:
    年龄:
      type: number
    身高:
      type: string
    当前状态:
      check:
        - **必须随正文实时更新**该女性朋友当前正在做什么
    生日:
      type: string
      format: MM-DD
    男朋友:
      type: string
      check:
        - 填写男朋友姓名；没有则填「无」
    详细当前面貌:
      check:
        - 描写该女性朋友当前的外貌状态
    详细性格:
      check:
        - 描写该女性朋友的性格特征
    穿着.${衣服|内衣|裤子|内裤|袜子|鞋子|配饰装饰}:
      check:
        - 换装、衣物被脱下、弄湿或损坏时更新对应部位
    私密.${奶子|阴毛|小穴|肛门}:
      check:
        - 身体被观察、抚摸或发生性行为时更新，详细描写样子与状态
    怀孕.子宫.状态: 同人妻
    怀孕.子宫.标注: 同人妻
    怀孕.内射次数: 同人妻
    怀孕.子女血脉: 同人妻

  背包.随身物品.${物品名}:
    type: |-
      {
        描述: string;
        数量: number;  // 默认为 1
      }
    check:
      - 获取、消耗、丢弃物品时更新数量
      - 数量归零后移除该条目

  背包.私密战利品.${战利品名}:
    type: |-
      {
        描述: string;    // 详细描写该战利品
        谁的: string;    // 原主人
        当前状态: string; // 该衣物/物品当前的状态（如刚脱下带体温、被射满等）
      }
    check:
      - 获得女性私密物品（内裤、胸罩等）时新增
      - 状态随战利品被使用/污染而变化

  女性心声:
    type: |-
      { [女性姓名: string]: string }  // 窃听到的最真实心里话
    check:
      - 主角使用窃听能力时，填入附近女性最真实的心里话
      - 心里话应包含该女性对主角或剧情的情感、欲望与攻略线索
      - 女性离开窃听范围或心里话变化时更新/移除

  商城.点数:
    type: number
    check:
      - 完成任务时按任务奖励增加
      - 主角购买道具时扣除对应价格
      - 不会低于 0

  商城.道具.${道具名}:
    type: |-
      {
        描述: string;
        价格: number;
        效果: string;
      }
    check:
      - 始终维持 4 个与当前任务相关的道具
      - 任务变更时重新生成道具
      - 主角购买某道具后，将其从商城移除并计入背包，再补上新道具凑齐 4 个

  任务:
    type: |-
      [
        { 名称: string; 描述: string; 点数: number }
      ]
    check:
      - 始终维持 2 个根据当前剧情生成的任务
      - 任务完成时：将该任务的点数加到 商城.点数，删除该任务，并立即生成一个新任务顶替
      - 任务的点数按难度设定（如 20~100）
