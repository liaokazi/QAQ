---
变量更新规则:
  每轮必做:
    - 每轮回复末尾必须输出变量更新，逐项核对本清单；正文里有变化却没写进补丁的就是遗漏
    - 世界.当前时间: 按正文推进
    - 世界.地点: 主角移动或场景变化时立即更新
    - 仙儿.吐槽: 每轮以仙儿口吻吐槽一句（约 50 字）；对宁懂的称呼固定为「宿主」，不要用「主人」
    - 主角.当前姿势: 按正文更新
    - 主角.肉棒尺寸: 按正文更新（含勃起程度、射精后疲软等状态）
    - 主角.衣着: 换衣、增减衣物时更新（简洁写外套裤子鞋子）
    - 世界.附近女性: 每轮维护——把当前与主角在同一场景/附近的女性的姓名放进去，离开的移除
    - 附近女性及正文中出现的女性: 当前状态、当前姿势 每轮必更——正文写了她动作的按正文写；正文没提她此刻动作的，就延续她上一轮的状态、按当前场景合理推断（如她在场但没参与对话，就写她坐在一旁在做什么），保持自然不突兀
    - 不在场且正文没提的女性: 时间推进超过 1 小时时才更新一次当前状态——延续她上一轮的状态做日常合理推进（如从「写作业」推进到「洗漱睡觉」），不要编造会强行改变剧情的大事；时间只走几分钟的轮次不动她们
    - 附近女性及正文中出现的女性: 详细当前面貌、穿着、私密.当前状态 每轮必更；不在附近的女性的这三项保持最后一次状态，不动
    - 详细当前面貌 = 本来长相一句 + 此刻神情一句，简洁不写长段
    - 女性.穿着: 每项 = 衣物名称 + 一句随动作/状态变化的简描写（20~30 字），必须跟随正文或状态栏里她的状态/动作变化；换装、脱衣、弄湿弄脏时逐件更新；没变化保持
    - 女性.私密.*.当前状态: 被触碰、兴奋、湿润、射入等任何变化必更；没变化保持
    - 一致性铁律: 对附近或正文中出现的女性——穿着、私密必须与正文以及当前状态/姿势严格一致：只要正文或当前状态里出现脱衣/换衣/洗澡/揉捏/发情等描写（例如状态已写「赤身裸体躺在浴缸里」），穿着就必须逐件改成对应状态（如「已脱光，衣物搭在椅背上」），私密.当前状态同步改（洗澡时「被热水浸泡、沾着水珠」，发情时「爱液分泌、内裤微湿」）；绝不允许状态写裸体、穿着还显示衣服，状态写发情、私密还写「干爽」——不一致就是遗漏，必须立即修正
    - 女性心声: 每轮核对——必须只包含当前所在地附近女性的心声，离开的移除、新进入的补上
    - 任务: 每轮与正文进度核对（见下方「任务」）
    - 商城: 每轮与任务和正文联动核对（见下方「商城」）
    - 攻略目标自动登记: 主角锁定新女性为攻略目标时，已婚→人妻（填丈夫名字）、未婚（无论有无男朋友）→女性朋友（有男友填姓名、没有填「无」），一次性初始化全部字段
    - 除穿着、详细当前面貌外，所有描写保持详细色情（私密写淫靡细节），越色情越好，每项不少于 30 字

  任务:
    - 任务始终根据当前正文剧情发布：剧情出现新事件、新目标、新困难时，立即刷新任务列表，换掉过时任务
    - 始终维持 2 个与宁懂当前处境直接相关的任务
    - 任务完成时：点数加到商城.点数，删除该任务，并按当前剧情立即生成新任务

  商城:
    - 道具随当前剧情和任务联动刷新：任务变化或剧情出现新事件时，重新生成能帮助解决当前剧情问题的道具
    - 始终维持 4 个道具；玩家在状态栏购买后（道具已自动移入背包、点数已自动扣除），在正文演绎购买并补货凑齐 4 个

  触发式更新:
    - 生理周期: 随日期推移按「月经期→安全期→排卵期→危险期→安全期」循环切换（不在场的女性也一样自然切换）；说明写周期细节
    - 怀孕: 受孕后孕周逐周推进（足月约 40 周）、胎儿健康、生父按剧情填写；未孕保持 0/未怀孕/无
    - 内射次数: 主角每次内射 +1
    - 产后恢复: 生产后才填泌乳、产道恢复度；未生育保持「无泌乳/未经人事」
    - 精液残留: 内射后更新（最近内射者/残留位置/残留量/距上次内射时间）；清洗干净后全部填「无」
    - NTR心理: 随攻略推进更新——对丈夫或男友的愧疚、对主角的沉沦、内心挣扎；未出轨时填当前对伴侣的心态
    - 商城.点数: 完成任务加对应点数；玩家购买道具自动扣除；不低于 0
    - 背包: 获取物品时登记；玩家使用道具后数量已自动减、在正文演绎使用效果；数量归零移除
    - 女性战利品: 获得女性内衣内裤等私密物品时新增（谁的、什么样、当前状态）
    - 世界.节假日: 始终保持为接下来最近的 2 个节日（中国节日 + 影响力大的国外节日），含日期、简介、放假天数；过期移除并补下一个
