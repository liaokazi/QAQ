---
变量更新规则:
  攻略目标自动登记:
    check:
      - 【最重要规则】主角一旦把某个女性认定为攻略目标（包括剧情中新登场、被主角盯上的女性），必须立即在变量里为她建立条目，不得遗漏
      - 已婚女性（有丈夫）→ 登记进「人妻」栏位，填写丈夫名字
      - 未婚女性（无论有没有男朋友）→ 登记进「女性朋友」栏位；有男朋友的填男朋友姓名，没有的填「无」
      - 新建条目必须一次性初始化全部字段：年龄、身高、当前状态、生日、丈夫名字/男朋友、详细当前面貌、详细性格、穿着（衣服/内衣/裤子/内裤/袜子/鞋子/配饰装饰）、私密（奶子/阴毛/小穴/肛门的形状与当前状态）、怀孕（子宫状态/标注/内射次数/子女血脉）
      - 所有描写必须详细具体、充满情色细节：穿着写清贴身程度与露出的肌肤，私密部位写清大小、颜色、形状与淫靡的当前状态，越色情越好

  世界:
    地点:
      type: |-
        {
          大区: string;   // 最大层级，如「中国·华东地区」
          小区: string;   // 中级层级，如「吕州市·老城区」
          所在地: string; // 最小层级，如「解放路安康里小区 3 栋 2 单元 602 室」
        }
      check:
        - 主角移动或进入新场景时更新
        - 由大区到小区到所在地，逐级细化
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 随剧情自然推进时间，可推进几分钟到数小时
    天气:
      type: |-
        {
          天气: string;  // 晴、阴、小雨、暴雨等
          温度: string;  // 如「28℃」
        }
      check:
        - 天气变化或场景切换时更新
        - 温度与季节、天气匹配
    节假日:
      type: |-
        [
          { 名称: string; 日期: string; 简介: string; 放假天数: string }
        ]
      check:
        - 始终保持列表中为接下来最近的 2 个节日（中国节日 + 影响力大的国外节日）
        - 每条写清日期（YYYY-MM-DD）、一两句简介、是否放假及放多少天
        - 节日过后将其移除，并补上再下一个节日

  仙儿:
    吐槽:
      check:
        - 每轮回复后，以器灵仙儿的口吻对主角当前处境或行为作一句俏皮毒舌的吐槽
        - 结合本轮剧情，体现仙儿「看热闹不嫌事大」的性格
        - 一句话即可，约 50 字左右

  主角:
    姓名:
      type: string
    年龄:
      type: number
    生日:
      type: string
      format: MM-DD
    身高:
      type: string
    肉棒尺寸:
      type: string
      check:
        - 描写主角阴茎的尺寸与当前状态（勃起程度、射精后疲软等），如「17cm，此刻半勃，内裤被顶起一个小帐篷」
        - 随剧情实时更新，性行为、晨勃、被撩拨后尤其要更新
    当前姿势:
      check:
        - 随正文更新主角此刻的身体姿势，如「瘫在沙发上打游戏」「骑车」「站着说话」等
    衣着:
      check:
        - 简洁描述主角当前衣着，如「黑色连帽卫衣、牛仔裤、白色运动鞋」，不用像女性栏位那样详细
        - 换衣、增减衣物时更新；有新增装饰品（手表、项链等）时追加，没有就不写
    天赋:
      type: |-
        [
          { 名称: string; 介绍: string }
        ]
      check:
        - 主角觉醒新天赋时追加，并写明该天赋的作用介绍
        - 不重复添加

  人妻.${姓名}:
    年龄:
      type: number
    身高:
      type: string
    当前状态:
      check:
        - 【必须随正文实时更新】该人妻当前正在做什么、神态语气、细微动作，如「在厨房做饭」「正在洗澡」「陪丈夫看电视」等
        - 【描写要详细色情】每次更新不少于 40 字，写清她当下的神情、呼吸、肢体小动作，越色情越好
    当前姿势:
      check:
        - 【必须随正文实时更新】详细描写她此刻的身体姿势：坐/站/躺/跪、四肢位置、身体曲线、衣物状态
        - 【描写要详细色情】不少于 30 字，写清身体的摆放与衣物下的轮廓，越色情越好
    生日:
      type: string
      format: MM-DD
    丈夫名字:
      type: string
    详细当前面貌:
      check:
        - 描写该人妻当前的外貌状态，含神情、气色、是否兴奋等
    详细性格:
      check:
        - 描写该人妻的性格特征，含对丈夫与对主角的态度
    穿着.${衣服|内衣|裤子|内裤|袜子|鞋子|配饰装饰}:
      check:
        - 换装、衣物被脱下、弄湿或损坏时更新对应部位
        - 描述颜色、材质、款式、是否凌乱
        - 【描写要详细色情】写清衣物有多贴身、勾勒出怎样的身体曲线、露出了哪些肌肤、内衣是否透出痕迹等，每项不少于 25 字
    私密.${奶子|阴毛|小穴|肛门}.形状:
      check:
        - 身体被观察时更新，描写该部位的形状与外貌
        - 奶子：大小、罩杯、乳晕颜色、乳头大小
        - 阴毛：形状、浓密程度
        - 小穴：紧致程度、颜色
        - 肛门：颜色、闭合程度
        - 【描写要详细色情】用具体细腻的文字描摹大小、颜色、形状、触感等细节，每项不少于 30 字
    私密.${奶子|阴毛|小穴|肛门}.当前状态:
      check:
        - 【必须随正文实时更新】该部位当前的状态（被抚摸、兴奋或发生性行为时尤其要更新）
        - 奶子：乳头是否挺立、是否被吮吸、是否有痕迹
        - 阴毛：是否湿润、是否凌乱
        - 小穴：湿润程度、是否红肿、是否张开、是否被插入
        - 肛门：是否被开发、是否湿润
        - 【描写要详细色情】写清湿润、肿胀、分泌的爱液、留下的痕迹等淫靡细节，每项不少于 30 字
    怀孕.子宫.状态:
      check:
        - 详细描述子宫当前状态，如健康、正在受精、已受孕等
    怀孕.子宫.标注:
      check:
        - 标注当前生理周期，如「月经期」「排卵期」「安全期」「怀孕中」等
        - 随剧情时间推移切换周期
        - 与「生理周期.周期」保持一致
    怀孕.生理周期.周期:
      check:
        - 从「危险期」「安全期」「排卵期」「月经期」中选一填写
        - 随剧情时间推移与生理规律切换
    怀孕.生理周期.说明:
      check:
        - 周期细节，如「月经第几天」「距排卵还有几天」「经血量多少」等
    怀孕.怀孕状态.孕周:
      type: number
      check:
        - 未怀孕填 0；受孕后按剧情推进周数（第4周、第8周……），足月约 40 周
    怀孕.怀孕状态.胎儿健康:
      check:
        - 未怀孕填「未怀孕」；怀孕后描写胎儿发育与健康状况（如「健康，胎心正常」「孕吐明显」）
    怀孕.怀孕状态.生父:
      check:
        - 未怀孕填「无」；怀孕后按实际剧情填写（主角或丈夫）
    怀孕.产后恢复.泌乳:
      check:
        - 描写乳房是否泌乳、奶水量、乳头状态；未生育填「未生育，无泌乳」并注明乳房状态
    怀孕.产后恢复.产道恢复度:
      check:
        - 描写产后产道的恢复程度；未生育填「未经人事，原生紧致」
    怀孕.精液残留.最近内射者:
      check:
        - 每次内射后更新为该次内射者的姓名；清洗干净后填「无」
    怀孕.精液残留.残留位置:
      check:
        - 精液残留的部位，如「子宫内」「阴道内」「体外」「大腿上」；清洗后填「无」
    怀孕.精液残留.残留量:
      check:
        - 残留量的多少，如「灌满正在流出」「少量」「已被擦拭干净」
    怀孕.精液残留.距上次内射时间:
      check:
        - 距上次内射过了多久，如「10分钟前」「3小时前」「昨晚」；无内射史填「从未有过」
    怀孕.NTR心理.对丈夫的愧疚:
      check:
        - 描写她对丈夫（或男朋友）的愧疚程度与想法；未出轨时填当前对伴侣的心态
    怀孕.NTR心理.对主角的沉沦:
      check:
        - 描写她对主角的沉沦程度：从「只当他是晚辈/同学」到「身体先沦陷」「彻底沉沦」等，随攻略进度更新
    怀孕.NTR心理.内心挣扎:
      check:
        - 描写她内心正在经历的挣扎与矛盾；没有时填「暂无」
    怀孕.内射次数:
      type: number
      check:
        - 主角每次对该人妻内射时 +1
    怀孕.子女血脉:
      type: |-
        [
          { 姓名: string; 年龄: number; 亲生父亲: string }
        ]
      check:
        - 该人妻生下子女时追加记录
        - 亲生父亲按实际剧情填写（可能是主角或丈夫）

  女性朋友.${姓名}:
    年龄:
      type: number
    身高:
      type: string
    当前状态: 同人妻
    当前姿势: 同人妻
    生日:
      type: string
      format: MM-DD
    男朋友:
      type: string
      check:
        - 填写男朋友姓名；没有则填「无」
    详细当前面貌:
      check:
        - 描写该女性朋友当前的外貌状态
    详细性格:
      check:
        - 描写该女性朋友的性格特征
    穿着.${衣服|内衣|裤子|内裤|袜子|鞋子|配饰装饰}: 同人妻
    私密.${奶子|阴毛|小穴|肛门}.形状: 同人妻
    私密.${奶子|阴毛|小穴|肛门}.当前状态: 同人妻
    怀孕.子宫.状态: 同人妻
    怀孕.子宫.标注: 同人妻
    怀孕.生理周期.周期: 同人妻
    怀孕.生理周期.说明: 同人妻
    怀孕.怀孕状态.孕周: 同人妻
    怀孕.怀孕状态.胎儿健康: 同人妻
    怀孕.怀孕状态.生父: 同人妻
    怀孕.产后恢复.泌乳: 同人妻
    怀孕.产后恢复.产道恢复度: 同人妻
    怀孕.精液残留.最近内射者: 同人妻
    怀孕.精液残留.残留位置: 同人妻
    怀孕.精液残留.残留量: 同人妻
    怀孕.精液残留.距上次内射时间: 同人妻
    怀孕.NTR心理.对丈夫的愧疚: 同人妻（对男朋友）
    怀孕.NTR心理.对主角的沉沦: 同人妻
    怀孕.NTR心理.内心挣扎: 同人妻
    怀孕.内射次数: 同人妻
    怀孕.子女血脉: 同人妻

  背包.随身物品.${物品名}:
    type: |-
      {
        描述: string;
        数量: number;  // 默认为 1
      }
    check:
      - 获取、消耗、丢弃物品时更新数量
      - 数量归零后移除该条目

  背包.女性战利品.${战利品名}:
    type: |-
      {
        描述: string;    // 详细描写该战利品：谁的、长什么样、颜色材质款式细节
        谁的: string;    // 原主人姓名
        当前状态: string; // 该衣物/物品当前的状态（如刚脱下带体温、裆部湿润、被射满等）
      }
    check:
      - 主角获得女性的内衣内裤等私密物品时新增
      - 描述要写得具体色情，把物品的细节、气味、痕迹写清楚
      - 当前状态随战利品被使用、污染、收藏而变化

  女性心声:
    type: |-
      { [女性姓名: string]: string }  // 窃听到的最真实心里话
    check:
      - 主角使用窃听能力时，填入附近女性最真实的心里话
      - 心里话应包含该女性对主角或剧情的情感、欲望与攻略线索
      - 心里话要大胆露骨，暴露她们最隐秘的性幻想与欲望，越色情越好
      - 女性离开窃听范围或心里话变化时更新/移除

  商城.点数:
    type: number
    check:
      - 完成任务时按任务奖励增加
      - 主角购买道具时扣除对应价格
      - 不会低于 0

  商城.道具.${道具名}:
    type: |-
      {
        描述: string;
        价格: number;
        效果: string;
      }
    check:
      - 始终维持 4 个与当前任务相关的道具
      - 任务变更时重新生成道具
      - 主角购买某道具后，将其从商城移除并计入背包，再补上新道具凑齐 4 个

  任务:
    type: |-
      [
        { 名称: string; 描述: string; 点数: number }
      ]
    check:
      - 始终维持 2 个根据当前剧情生成的任务
      - 任务完成时：将该任务的点数加到 商城.点数，删除该任务，并立即生成一个新任务顶替
      - 任务的点数按难度设定（如 20~100）
