世界观:
  时间:
    时代: 21世纪当下的中国
    当前日期: 2021年11月13日，星期六
  地点: 吕州市，虚构的华东地级市，人口约三百万。位于两条河流交汇处，自古是交通要道，近代因工业兴起，如今转型为以教育、医疗、服务业为主的中型城市。经济水平在省内排中上，节奏不快不慢，房价约1.5到2万每平，老城区稍低，新城区稍高。
  家庭住址: 宁家在吕州市老城区解放路安康里小区3栋2单元602室；周明宇家在同一个小区5栋1单元402室（父亲周海涛、母亲林慧、儿子周明宇）

  城市格局:
    老城区: |-
      吕州的根。街道不宽，两旁是梧桐树，夏天遮天蔽日，秋天落叶满街。建筑多为上世纪八九十年代的老居民楼，六七层高，外墙刷过几轮漆，颜色从灰白到土黄都有。一楼多改成了小卖部、早餐店、理发店、文具店和补习班。菜市场在巷子深处，早上六点就热闹。吕州二中、吕州市第一人民医院、宁家所在的老小区都在这一片。老城区的人说话嗓门大，街坊邻居互相认识，谁家孩子考了多少分全巷子都知道。
    新城区: |-
      吕州的门面。十几年前开始开发，马路宽、绿化好、高楼多。万达广场、吾悦广场、各种连锁店和网红咖啡馆都在这里，年轻人结婚买房大多选这边。晚上灯亮起来比老城区现代，但也冷清得多——老城区晚上还有烧烤摊和夜市，新城区九点以后街上就没什么人了。
    城郊: |-
      高铁站、汽车站、物流园和一些工厂。吕州东站是高铁站，到省城四十分钟，到上海两个多小时。城郊还有几片没拆完的城中村，房租便宜，住着刚毕业的年轻人和外来务工人员。

  交通:
    公交: 线路密集，老城区和新城区都有覆盖，票价1到2元，学生卡半价。早晚高峰挤，平时还好。
    地铁: 目前只有1号线，南北走向，连接老城区、火车站和新城区。2号线在建，预计两年后通车。学生和上班族主要靠地铁通勤。
    共享单车和电动车: 吕州地势平，骑车方便。学生多骑自行车或电动车上学，满街都是蓝的黄的共享单车。
    私家车: 中产家庭普遍有车，但老城区停车难，很多人宁愿骑车或坐地铁。

  教育:
    吕州二中: |-
      市重点高中，创办于1956年，在老城区。本科率约85%，一本率约40%。分东西两个校区，东校区是高一高二，西校区是高三。校园不大但树多，有座老钟楼是二中标志。高三一班是理科重点班，班主任宁秋婉（教数学），教室在后楼三楼最东边，窗外能看到操场和梧桐树。
    学生作息: |-
      早7:00到校早读，上午四节课，下午三节课，晚自习18:30到21:30。周六补课半天，周日休息。月考、期中、期末排名公开张贴在年级公告栏。高二开始分科，高三一班是理科重点，学生压力大，补课是常态。
    吕州大学: |-
      省属一本。原校区在新城区东边，三年前美术与设计学院整体搬迁至老城区东侧的新校区，位于吕州二中往东三站地铁的位置，与老城区接壤。从宁家骑车约十五分钟，坐地铁两站，走路半小时。新校区占地不大但设施新，美术与设计学院有独立的教学楼、画室和展厅。视觉传达设计专业大四以毕业设计加实习为主（注：宁晚已24岁毕业工作，此条为学校概况保留）。
    宁晚的住处: |-
      宁晚已毕业工作，在吕州本地一家设计公司做插画师。因为吕州大学新校区离家太近，她毕业后也没有搬远，一直住家里。她那间房重新收拾过，画架、电脑、数位板占了大半个房间。她中午没课就回家吃饭，晚上在家画稿，和宁懂斗嘴的频率直线上升。
    补习文化: |-
      吕州家长普遍焦虑，课外补习盛行。二中门口一条街全是补习班，数学、英语、物理最火。宁秋婉是数学老师，从不给自己学生有偿补课，但架不住亲戚朋友托关系。宁晚高中时被母亲教过数学，同学都知道，她压力大到爆炸，数学反而成了心结。

  医疗:
    吕州市第一人民医院: |-
      老城区最大的三甲医院，宁建国在这里当外科医生。医院主楼是新建的，老楼还在用。外科在六楼，宁建国每周三个手术日两个门诊日，常值夜班。医院离家骑车十五分钟，宁建国每天回家，但经常回来就瘫在沙发上。

  社会生活:
    经济: 中产家庭为主，双职工普遍。医生、教师、公务员是体面稳定的职业，收入中上但工作强度大。吕州人不算特别拼，讲究日子过得舒服。
    文化: 传统与现代并存。长辈重教育、重稳定，觉得医生教师公务员最好；年轻人重个性、重表达。微信、QQ、抖音、B站、小红书是日常社交平台，学生用QQ多，成年人用微信多。
    饮食: 吕州口味偏咸鲜，爱吃面食和炖菜。早餐常见小笼包、豆浆、油条、鸡蛋饼。老城区有家开了三十年的面馆，宁晚和宁懂从小吃到大。
    休闲: 老城区有夜市和烧烤摊，新城区有商场和电影院。年轻人爱去万达广场，中年人爱去公园。吕州有个南湖公园，周末人多。

  家庭与居住:
    宁家: |-
      老城区一个老小区，六楼没电梯，三室一厅。宁秋婉和宁建国一间，宁晚一间，宁懂一间。宁晚搬回家住后，她那间房重新收拾过，画架、电脑、数位板占了大半个房间。
    宁家日常: |-
      早上宁秋婉六点半出门，宁建国七点走，宁懂七点前骑车去二中，宁晚上午有课就八点出门、没课就睡到自然醒。中午宁晚偶尔回家吃饭。晚上宁秋婉九点半到家，宁建国看情况，宁晚在家画稿，宁懂写作业。周末宁建国做饭，宁秋婉批卷，宁晚画稿。一家四口凑齐吃饭的时候不多，但凑齐了就是大事。

  日常基调: |-
    现实向都市日常，温暖与压力并存。有家庭琐碎、学业压力、职场疲惫，也有姐弟斗嘴、母亲深夜批卷、父亲回家做饭的烟火气。吕州不大不小，日子不快不慢，每个人都在自己的轨道上忙，但家是共同的锚点。