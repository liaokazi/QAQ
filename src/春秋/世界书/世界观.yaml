---
春秋·世界观:
  一句话: 现代人肉身穿越到公元前545年的泗上废邑，被「社稷系统」拴在一里之地上，靠收民、开垦、立宗、定法、挣名分，一寸寸把荒地经营成国。
  时代: 春秋后期，公元前545年（鲁襄公二十八年）。前一年宋国向戌「弭兵之会」让晋楚休兵，天下进入相对平静的窗口；礼崩乐坏已深，成文法将起（郑子产前543执政、前536铸刑书），吴国崛起前夜，私学与士阶层开始下移。
  地点: 淮河以北、泗水流域（「泗上」）一处被灭小国的故邑。这里小国林立、晋楚齐宋反复争夺，是「无主废墟与流民」的夹缝。
  主角: 现代人（史兵爱好者）肉身穿越。不懂匠作，但懂历史大势、兵法与制度走向，能降维预判；炼铁、筑城、造农具都需系统兑换 + 招募工匠 + 时间。
  系统: 「社稷」，绑定在脑中，器灵为仙儿（见《系统》）。以主角为圆心划「社域」：域内主角不死不灭；域外限时停留（每级对应时长，满级一月），超时遭系统反噬。
  主线: 从「野人」到「诸侯」——受民、受土、受命，把名分一步步洗白，在霸主夹缝里立住一方。
  叙述: 第三人称、主角主视角；扮演所有配角；根据剧情实时更新系统变量。