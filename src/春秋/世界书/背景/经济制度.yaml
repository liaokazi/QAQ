---
春秋社会经济与制度:

  经济运转（生产→流通→分配→税收→扩张）:
    - 农业: 井田/私田并行，公田产出归公上缴、私田自耕；以「公田徭役」征发民力。后期可推「履亩而税」(如鲁前594初税亩) 把地权明细化，是变法爆点
    - 手工业: 官营为主（工商食官），工官管理百工（陶人、玉人、筑氏等）；民营匠人开始冒头
    - 市场: 设「市」于城，有市人/贾人管理，交易需「质剂」(竹木契约)；设关、市收「关市之征」(过路税+市税)
    - 货币: 日常以物易物 + 实物货币（布帛、粮食、牲畜、青铜块、珠玉）为主；铜铸币(布币/刀币/铜贝)在部分地区萌芽；布帛是硬通货
    - 借贷: 已出现，以质剂立契，高利盘剥是「富役贫、兼并土地」的矛盾源头
    - 商人: 自由商人已活跃（郑国商人弦高「犒秦师」），商人通贵通国，是情报与物流暗线

  七大社会制度（可玩系统）:
    - 宗法: 立谱系/氏、嫡长子继承、大宗小宗、同姓不婚(婚姻即外交)、男子称氏女子称姓、谥号避讳；冲突在废长立贤、异姓入宗、联姻结盟
    - 土地与赋役: 井田九田格局、公田上交私田自耕；后期「履亩而税」是爆点
    - 法律: 从「法不可知则威不可测」到「出令、悬法、铸刑书公开」(史实: 子产前536铸刑书、晋前513铸刑鼎)；系统提供「法典编纂」成长线
    - 礼乐与名分: 等级定器物车服葬制；天子九鼎八簋、诸侯七鼎六簋、大夫五鼎四簋、士三鼎二簋；车服以「命」计；主角的鼎数即名分线
    - 国野与军制: 国人(自己人、当兵) vs 野人(种地纳贡)；车战以「乘」计(千乘之国)，国人当兵；主角用冶铁/城防/弩做降维
    - 工商与市场: 工官、设市、度量衡、质剂、货币；统一度量衡是强力整合手段
    - 教育与养士: 养门客、办私学(呼应孔子)，攒人才与名望，进入百家争鸣的入口