---
势力表（约 545 BCE，以泗上落点为中心）:

  霸主级:
    - 晋｜都新田(绛)｜晋平公·赵武(文子)任正卿｜中原霸主，卿族坐大内斗埋雷，终致三家分晋｜站队首选，借力也要防被吞
    - 楚｜都郢｜楚康王(本年将崩)→郏敖→楚灵王(前540篡)｜南方霸主，向淮泗扩张吞小国｜主要外部压力，弭兵后暂缓
    - 齐｜都临淄｜齐景公·晏婴辅政｜东方富国，鱼盐桑麻之利，田氏渐强｜近邻贸易对象，也是吞并东夷小国的威胁
    - 吴｜都吴(苏州)｜余祭在位，季札次年(前544)聘问列国｜东南后起，始通中原、学车战，剑名，上升最快｜远期风口，前506将破楚

  中原礼乐/缓冲国:
    - 宋｜都商丘｜宋平公·向戌｜商遗民，晋楚缓冲，向戌主持弭兵(前546)声望高｜会盟与外交舞台
    - 鲁｜都曲阜｜鲁襄公·三桓(季/孟/叔)｜周礼保存最完整，公室弱于三桓，孔子本年约6岁｜名分/礼制的权威参照，可证「受命」
    - 郑｜都新郑｜郑简公·子产将执政(前543)｜四战之地商贾最繁，善夹缝外交｜「定法」的活榜样，最可能的学习与结盟对象
    - 卫/曹/陈/蔡｜周初老封国，沦为晋楚附庸、四战小强｜聘问、会盟、联姻的背景与道具国

  落点周边小国群:
    - 薛(任姓)、滕(姬姓)、小邾/郳(曹姓)、邾(曹姓)、莒(东夷己姓)、徐(淮夷嬴姓，渐衰，前512终为吴灭)、钟离(淮夷)｜被齐楚宋反复争夺、朝不保夕｜无主废墟与流民、被灭国遗民的来源
    - 主角落点即其中一片已灭小国故地（如遂、鄣、根牟，皆已亡于齐或鲁）

  周王室:
    - 周｜都洛邑(成周)｜周灵王(前571—545，本年崩)→周景王(前544即位)｜天下共主，权威只剩名分与礼器｜「受命」的最终合法来源

当前历史人物表（545 前后）:
  可打交道:
    - 晏婴(齐相，约前578—500)：身矮清廉善辩，可作「以礼治国」参照或外交对手
    - 子产(郑，约前583—522)：前543执政、前536铸刑书，「定法」的明灯
    - 叔向(晋，羊舌肸)：贤大夫，通礼法善辞令，晋国名分守门人
    - 赵武(晋，正卿)：弭兵晋方主持者，「赵氏孤儿」本尊
    - 季札(吴，延陵季子)：三让王位，次年聘问诸国，与吴建交窗口
    - 老子(周，约前571生，本年约26岁)：周王畿守藏室之史，洛邑可遇
    - 向戌(宋)：弭兵主持者，外交人脉入口
  在位背景板: 齐景公、晋平公、郑简公、鲁襄公、宋平公、楚康王(为此年崩)、周灵王(此年崩)、郏敖/楚灵王、吴王余祭；三桓(叔孙豹「三不朽」、季武子、孟庄子)
  远期伏笔(主角心里有数): 伍子胥(约14岁)、孙武(婴孩)、阖闾、范蠡、勾践——未来十年的大势棋子