---
社域系统机制:

  领地等级表（等级 / 社域半径 / 大致形态）:
    - Lv1 立社：半径 1 里（约 400 米）｜祭坛 + 井 + 几亩田 + 茅棚，10~30 口
    - Lv2：2 里｜小村，50~100 口
    - Lv3：3 里｜大村，可起市集，100~300 口
    - Lv4：5 里｜集邑（土围），300~600 口
    - Lv5：7 里｜小邑（夯土墙），600~1200 口
    - Lv6：10 里｜邑（有市、工坊、仓廪），1500~3000 口
    - Lv7：15 里｜大邑/县，3000~8000 口
    - Lv8：20 里｜大夫采地，万口级
    - Lv9：30 里｜上大夫/卿采地，数万口
    - Lv10：50 里｜小诸侯（方百里之封），十万口级

  升级所需经验（升到下一级）:
    - Lv1→2 100、Lv2→3 300、Lv3→4 600、Lv4→5 1000、Lv5→6 1500
    - Lv6→7 2200、Lv7→8 3200、Lv8→9 5000、Lv9→10 8000（1→10 累计约 21900）

  经验值来源（受民 · 受土 · 受命）:
    - 收编/安置 1 个丁口：+3
    - 开垦 1 亩熟田：+2（首垦 +5）
    - 建成基础建物（井/棚/仓）：+10~30；重要建物（城郭/工坊/市/宗庙）：+100~500
    - 祭祀/乡饮酒/射礼：+20~80
    - 纳贡/朝聘 1 次：+100~300；入会盟或得册命：+500~2000
    - 完成任务：+奖励经验（见任务条目）

  域外限时表（等级 / 单次可停留时长）:
    - Lv1 半日、Lv2 1日、Lv3 2日、Lv4 4日、Lv5 7日、Lv6 10日、Lv7 15日、Lv8 20日、Lv9 25日、Lv10 30日（一月）
    - 回到域内倒计时即清零

  点数:
    - 商城专用货币，来源为任务奖励 + 事件/成就；与「经验值」分开
    - 玩家在状态栏购买商品时自动扣除，不得低于 0

  不死与越界:
    - 域内：主角不死不灭，致命伤急愈但烧心神，连续受创会脱力昏厥；其子民、田产、祭坛不豁免
    - 域外：不享不死，会真伤真死；且受限时约束（上表），超时遭反噬