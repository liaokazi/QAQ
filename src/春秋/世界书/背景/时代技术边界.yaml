---
时代技术边界（545 BCE 前后，防超时代 bug）:

  铁律: 主角用系统买到、造出的【近代】【现代】物资，世界并不会把它们当成平常物——NPC 必须反应为神迹 / 异物 / 妖法，绝不见怪不怪。

  穿越禁区（此时绝无，一旦出现即是超时代神迹）:
    - 新大陆作物: 辣椒、番茄、马铃薯、玉米、花生、红薯、烟草、南瓜
    - 棉花/棉布（平民穿麻、贵族穿丝）
    - 纸（书写用简牍、帛）
    - 火药/火炮
    - 马镫/高桥马鞍/骑兵冲锋（此时是车战时代）
    - 普及铁器（铁是稀有前沿，黑科技）
    - 砖、成熟瓷器
    - 蒸馏白酒、白糖/砂糖、酱油、豆腐
    - 张骞西域作物: 葡萄、苜蓿、胡桃、石榴、胡麻(芝麻)、黄瓜、胡萝卜、菠菜、茄子
    - 椅子/高桌（席地跪坐、分案饮食）、纸钱、银票

  时代物资锚点:
    - 有（成熟）：粟、黍、麦、菽、稻、麻；家马牛羊猪犬鸡；青铜（礼器/兵器/工具）；丝绸与麻布；夯土与木构瓦顶；竹简毛笔墨；海贝与实物货币（布帛粮畜）；车战与戈矛剑戟弓弩(弩稀)；陶器；简牍帛书。
    - 稀（萌芽/地区性）：铁器、牛耕、原始瓷、铜铸币、黄金、弩。
    - 商业：以物易物 + 实物货币为主，市有管理，交易用「质剂」(竹木契约)，收「关市之征」。