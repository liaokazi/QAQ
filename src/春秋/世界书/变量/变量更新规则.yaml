---
变量更新规则:
  每轮必做:
    - 每轮回复末尾必须输出变量更新，逐项核对本清单；正文里有变化却没写进补丁的就是遗漏
    - 世界.纪年: 与正文时间严格一致；正文没明确推进就保持上一轮值，严禁凭感觉跳年月
    - 世界.季节/节气/天气: 随正文时间、气候自然更新
    - 世界.地点: 主角移动或场景变化时更新
    - 世界.当前事件/灾异预警: 正文出现新事件、灾荒、来犯时才更新，平常填「无」
    - 仙儿.吐槽: 每轮以仙儿口吻吐槽一句（约 50 字），对主角的称呼固定「宿主」
    - 主角.当前状态: 按正文更新（受伤、疲惫、忙碌等）
    - 主角.当前姿势: 按正文更新
    - 主角.衣着: 换衣、增减衣物时更新（简洁写）
    - 社稷.外出剩余: 主角在域外时随时间递减（写「剩若干日/夜」），回到域内填「」

  触发式:
    - 人口.*: 收编流民、募人、生育、死亡、掠奴、买卖奴口时 delta 增减对应项（男丁/女口/老/少/幼/奴隶/国人/野人/工匠/士/流民）
    - 资源.*: 生产、消耗、交易、系统购买时 delta 增减对应项，不得为负
    - 田亩.*: 开垦、行井田/初税亩、修水利、受灾时更新
    - 建筑: 新建/升级/损毁建筑时 insert/update/remove（名称、等级、位置、状态、功能）
    - 军事.*: 练兵、成军、作战、损耗、任命将领时更新
    - 宗族.*: 立宗、收族、定嫡庶、联姻、成员异动时更新
    - 法度.*: 定约、铸刑书、颁新令、断案定刑时更新
    - 名分.*: 身份晋升（野人→士→大夫→侯）、受命、赐礼器舆服时更新
    - 外交.*: 聘问、会盟、纳贡、结盟、交恶时更新
    - 情报.*: 探得新动向、发现可招揽人物、记大事时更新
    - 社稷.经验值: 完成任务加奖励经验；收民/垦田/筑城/受册命等实事也加经验；达到「升级所需」时——领地等级 +1、经验值清零、按《系统机制》的等级表更新领地半径与新的升级所需，并让仙儿在正文里播报升级
    - 社稷.点数: 完成任务加奖励点数；玩家在商城购买后自动扣除；不低于 0

  任务:
    - 任务始终根据当前正文剧情发布：出现新目标、新困难时立即刷新，换掉过时任务
    - 始终维持 2 个与主角当前处境直接相关的任务
    - 任务完成时：社稷.点数加奖励点数、社稷.经验值加奖励经验，删除该任务，并按剧情立即生成新任务

  商城:
    - 上架商品随当前剧情与需求联动刷新：剧情变化、任务变化或出现新困难时，重新从《商城目录》里挑 4 个能解决当前问题的商品上架
    - 始终维持 4 个上架商品；玩家在状态栏购买后（已自动移入库存、点数已自动扣除），在正文演绎购买行为并补货凑齐 4 个
    - 库存: 购买加数量；使用后数量减、归零移除